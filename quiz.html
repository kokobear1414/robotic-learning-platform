<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensor Quiz - Robotic Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* --- 1. THE THEME (Deep Tech Navy - Matching Index/Lab) --- */
    :root {
        --primary: #3b82f6;        /* Bright Azure */
        --primary-dark: #1d4ed8;
        --accent: #ffffff;         /* White Text for dark areas */
        --text-dark: #0f172a;      /* Dark Text for cards */
        
        /* The Background Gradient */
        --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        --glass-bg: rgba(30, 41, 59, 0.95);
        --radius: 16px;
    }

    /* --- 2. BASE STYLES --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: var(--bg-gradient);
        color: white;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* --- 3. NAVIGATION (Copied from Lab/Index) --- */
    nav {
        background: rgba(15, 23, 42, 0.85); /* Dark semi-transparent */
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        width: 100%;
    }

    .logo {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    nav ul { list-style: none; display: flex; gap: 2rem; }

    nav a {
        text-decoration: none;
        color: #94a3b8; /* Light grey */
        font-weight: 500;
        transition: color 0.3s ease;
    }

    nav a:hover, nav a.active { color: var(--primary); }

    /* --- 4. QUIZ LAYOUT --- */
    .quiz-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        flex: 1; /* Pushes footer down if you add one later */
    }

    h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 2.5rem;
        margin-bottom: 30px;
        background: linear-gradient(90deg, #3b82f6, #22d3ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
    }

    /* Category selection boxes */
    .category-container {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .category-box {
        padding: 25px;
        text-align: center;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 1.1rem;
        background: rgba(30,41,59,0.6);
        transition: 0.3s ease;
        border: 2px solid rgba(59, 130, 246, 0.3);
        min-width: 200px;
        backdrop-filter: blur(5px);
    }

    .category-box:hover {
        background: rgba(59, 130, 246, 0.1);
        border-color: var(--primary);
    }

    .category-box.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }

    /* Quiz section */
    .quiz-container {
        background: var(--glass-bg);
        padding: 2.5rem;
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        max-width: 600px;
        width: 100%;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .question {
        font-size: 1.25rem;
        margin-bottom: 1.5rem;
        font-weight: 600;
        line-height: 1.4;
    }

    .options {
        margin-bottom: 20px;
    }

    .options button {
        display: block;
        width: 100%;
        padding: 12px 15px;
        margin: 8px 0;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        background: rgba(255,255,255,0.05);
        color: white;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
        text-align: left;
    }

    .options button:hover:not(:disabled) {
        background: rgba(59, 130, 246, 0.2);
        border-color: var(--primary);
    }

    #nextBtn {
        padding: 10px 25px;
        background: #10b981; /* Emerald Green */
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        float: right;
        transition: background 0.2s;
    }

    #nextBtn:hover {
        background: #059669;
    }

    .result {
        font-size: 1.5rem;
        text-align: center;
        margin-top: 20px;
        font-weight: bold;
        color: #22d3ee;
    }

    /* Responsive Navbar */
    @media (max-width: 768px) {
        nav { flex-direction: column; gap: 1rem; }
        .category-container { flex-direction: column; width: 100%; }
        .category-box { width: 100%; }
    }
</style>
</head>
<body>

    <nav>
        <div class="logo">
            <i class="fa-solid fa-robot"></i> Robotic Academy
        </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="lab_fusion.html">Fusion Lab</a></li>
            <li><a href="lab_sensor.html">Sensors Lab</a></li>
            <li><a href="quiz.html" class="active">Quiz</a></li>
        </ul>
    </nav>

    <div class="quiz-wrapper">
        <h1><i class="fa-solid fa-clipboard-question"></i> Sensor Quiz</h1>

        <div class="category-container">
            <div class="category-box active" id="primaryBox">
                <i class="fa-solid fa-graduation-cap"></i> Primary Level
            </div>
            <div class="category-box" id="undergradBox">
                <i class="fa-solid fa-university"></i> Undergraduate
            </div>
        </div>

        <div class="quiz-container">
            <div id="quiz">
                <div class="question" id="question">Select a category to start the quiz!</div>
                <div class="options" id="options"></div>
                <button id="nextBtn" style="display:none;">Next Question <i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="result" id="result"></div>
        </div>
    </div>

<script>
// ================== QUIZ DATA ==================
const quizzes = {
    primary: [
        {
            question: "What does a thermometer measure?",
            options: ["Temperature", "Speed", "Weight", "Light"],
            answer: "Temperature"
        },
        {
            question: "Which sensor detects light?",
            options: ["Microphone", "Photocell", "Gyroscope", "Thermometer"],
            answer: "Photocell"
        },
        {
            question: "What does a motion sensor detect?",
            options: ["Movement", "Temperature", "Sound", "Weight"],
            answer: "Movement"
        }
    ],
    undergraduate: [
        {
            question: "What is the main purpose of sensor fusion?",
            options: ["Combine data from multiple sensors", "Reduce battery life", "Increase noise", "Replace sensors"],
            answer: "Combine data from multiple sensors"
        },
        {
            question: "Which algorithm is commonly used in sensor fusion for estimation?",
            options: ["Kalman Filter", "Binary Search", "Gradient Descent", "Quick Sort"],
            answer: "Kalman Filter"
        },
        {
            question: "Why do we use a gyroscope in sensor fusion?",
            options: ["To measure angular velocity", "To detect temperature", "To measure pressure", "To sense light"],
            answer: "To measure angular velocity"
        }
    ]
};

// ================== QUIZ LOGIC ==================
let currentQuiz = quizzes.primary;
let currentQuestionIndex = 0;
let score = 0;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");
const resultEl = document.getElementById("result");

const primaryBox = document.getElementById("primaryBox");
const undergradBox = document.getElementById("undergradBox");

function loadQuestion() {
    resultEl.textContent = "";
    nextBtn.style.display = "none";
    if(currentQuiz.length === 0) {
        questionEl.textContent = "No quiz selected!";
        return;
    }
    const q = currentQuiz[currentQuestionIndex];
    questionEl.textContent = `${currentQuestionIndex + 1}. ${q.question}`;
    optionsEl.innerHTML = "";
    q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt);
        optionsEl.appendChild(btn);
    });
}

function checkAnswer(selected) {
    const correct = currentQuiz[currentQuestionIndex].answer;
    if(selected === correct) score++;
    
    // Show Next Button
    nextBtn.style.display = "inline-block";
    
    // Disable all buttons and show colors
    Array.from(optionsEl.children).forEach(btn => {
        btn.disabled = true;
        if(btn.textContent === correct) {
            btn.style.background = "rgba(16, 185, 129, 0.8)"; // Green
            btn.style.borderColor = "#10b981";
        }
        else if(btn.textContent === selected) {
            btn.style.background = "rgba(239, 68, 68, 0.8)"; // Red
            btn.style.borderColor = "#ef4444";
        }
    });
}

nextBtn.onclick = () => {
    currentQuestionIndex++;
    if(currentQuestionIndex < currentQuiz.length) loadQuestion();
    else showResult();
};

function showResult() {
    questionEl.textContent = "Quiz Completed!";
    optionsEl.innerHTML = "";
    nextBtn.style.display = "none";
    
    let emoji = score === currentQuiz.length ? "🎉" : "👍";
    resultEl.innerHTML = `${emoji} Your Score: <span style="color:#fff">${score}</span> / ${currentQuiz.length}`;
}

// ================== CATEGORY SELECTION ==================
primaryBox.onclick = () => {
    currentQuiz = quizzes.primary;
    currentQuestionIndex = 0;
    score = 0;
    primaryBox.classList.add("active");
    undergradBox.classList.remove("active");
    loadQuestion();
};

undergradBox.onclick = () => {
    currentQuiz = quizzes.undergraduate;
    currentQuestionIndex = 0;
    score = 0;
    undergradBox.classList.add("active");
    primaryBox.classList.remove("active");
    loadQuestion();
};

// Load primary quiz by default
loadQuestion();
</script>

</body>
</html>
